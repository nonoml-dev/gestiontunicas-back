name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - 'H*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-y-tests:
    name: build-y-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gestiontunicas
          POSTGRES_USER: gestiontunicas
          POSTGRES_PASSWORD: solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestiontunicas -d gestiontunicas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base de datos vacia: la crea sql/esquema.sql y Hibernate comprueba que coincide con las entidades.
      DB_PASSWORD: solo-para-ci
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y ejecutar los tests
        run: ./mvnw -B -ntp verify
