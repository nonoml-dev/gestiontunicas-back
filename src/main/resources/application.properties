spring.application.name=gestiontunicas

# De momento se trabaja siempre con el perfil dev (base de datos local).
# En producción se sobrescribe con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=dev

# JPA: Hibernate genera el esquema a partir de las entidades (@Table, @Column...).
# ATENCIÓN: "create" borra y vuelve a crear todas las tablas en cada arranque (se pierden los datos).
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Lo que Hibernate no sabe generar (extensiones, índices parciales y trigram) se crea con este
# script justo después de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/postcreacion-esquema.sql
