spring.application.name=gestiontunicas

# De momento se trabaja siempre con el perfil dev (base de datos local).
# En producción se sobrescribe con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=dev

# El esquema lo crea sql/esquema.sql si la base de datos está vacía. Hibernate no modifica las tablas.
# ATENCIÓN: no usar "create": borra todas las tablas en cada arranque (se pierden los datos).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Los scripts se ejecutan antes de iniciar JPA, en este orden y en cada arranque. Son idempotentes:
# esquema.sql crea las tablas si no existen, postcreacion-esquema.sql añade extensiones e índices
# y datos-iniciales.sql añade los roles y la configuración que falten.
# Cada fichero se envía entero porque esquema.sql es un único bloque DO.
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
spring.sql.init.schema-locations=classpath:sql/esquema.sql
spring.sql.init.data-locations=classpath:sql/postcreacion-esquema.sql,classpath:sql/datos-iniciales.sql

# Muestra las sentencias SQL por consola
spring.jpa.show-sql=true

# Token JWT del inicio de sesión (HS256). La clave se pasa con la variable de entorno JWT_SECRET
# (al menos 32 caracteres); en el perfil dev hay una clave de pruebas en application-dev.properties.
app.seguridad.jwt.secret=${JWT_SECRET:}
# Token de acceso corto; el refresh token mantiene la sesión abierta durante una jornada de reparto.
app.seguridad.jwt.duracion=PT15M
app.seguridad.jwt.duracion-refresh=PT12H

# Primer administrador: solo se crea si no hay ningún administrador activo. Debe cambiar la contraseña al entrar.
app.seguridad.admin.username=${ADMIN_USERNAME:}
app.seguridad.admin.password=${ADMIN_PASSWORD:}

# Subida del Excel de hermanos (y más adelante de túnicas y de la plantilla del resguardo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
