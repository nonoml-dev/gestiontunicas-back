spring.application.name=gestiontunicas

# De momento se trabaja siempre con el perfil dev (base de datos local).
# En producción se sobrescribe con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=dev

# JPA: Hibernate genera el esquema a partir de las entidades (@Table, @Column...).
# ATENCIÓN: "create" borra y vuelve a crear todas las tablas en cada arranque (se pierden los datos).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Lo que Hibernate no sabe generar (extensiones, índices parciales y trigram) se crea con este
# script justo después de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/postcreacion-esquema.sql

# Muestra las sentencias SQL por consola
spring.jpa.show-sql=true

# Token JWT del inicio de sesión (HS256). La clave se pasa con la variable de entorno JWT_SECRET
# (al menos 32 caracteres); en el perfil dev hay una clave de pruebas en application-dev.properties.
app.seguridad.jwt.secret=${JWT_SECRET:}
# Token de acceso corto; el refresh token mantiene la sesión abierta durante una jornada de reparto.
app.seguridad.jwt.duracion=PT15M
app.seguridad.jwt.duracion-refresh=PT12H

# Subida del Excel de hermanos (y más adelante de túnicas y de la plantilla del resguardo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
