# Perfil de producción. Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
# Los secretos no tienen valor por defecto: si falta alguna variable, la aplicación no arranca.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.seguridad.jwt.secret=${JWT_SECRET}

# El esquema lo crea sql/esquema.sql. Hibernate solo comprueba que coincide con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sin documentación de la API
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: solo el estado general, sin detalles internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Los errores no devuelven detalles internos
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# La IP del registro de inicios de sesión llega de Nginx. Solo se confía en proxies de la red interna,
# así que el puerto del backend no debe publicarse fuera de esa red.
server.forward-headers-strategy=native

# CORS: no se configura a propósito. Nginx sirve el front y la API en el mismo origen.

# Logs por consola (Docker los recoge)
logging.level.root=INFO
logging.level.es.nonomldev.gestiontunicas=INFO
